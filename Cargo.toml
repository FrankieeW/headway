[workspace]
resolver = "3"
members = ["crates/headway-core", "crates/headway-cli", "src-tauri"]
# The desktop crate embeds the built frontend (`dist/`), so plain `cargo build` / `cargo test`
# at the root only covers the engine and the CLI. Use `pnpm tauri dev|build` for the app.
default-members = ["crates/headway-core", "crates/headway-cli"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["FrankieeW <git@frankie.wang>"]
repository = "https://github.com/FrankieeW/headway"

[workspace.dependencies]
headway-core = { path = "crates/headway-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Pedantic since clippy 1.99; `assert!(x.is_empty())` reads better in tests.
assert_is_empty = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
