name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The desktop crate embeds the built frontend, so `dist/` has to exist
      # before cargo compiles or tests the workspace.
      - name: Build renderer
        run: pnpm build:renderer

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build the self-hosted app for this commit
        run: ./scripts/build-headway.sh app

      - name: Verify self-hosted artifacts
        shell: bash
        run: |
          set -euo pipefail
          HEADWAY_HOME="$(mktemp -d)" .headway-out/Headway.app/Contents/MacOS/headway --json version > .headway-out/build-info.json
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync(".headway-out/build-info.json", "utf8"));
            assert.equal(report.ok, true);
            assert.equal(report.data.commit, process.env.GITHUB_SHA);
            assert.equal(report.data.dirty, false);
            assert.equal(report.data.repository, process.env.GITHUB_REPOSITORY);
          '
          codesign --verify --deep --strict .headway-out/Headway.app

  frontend:
    name: frontend (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test Homebrew release planner
        run: node --test scripts/update-homebrew-tap.test.mjs
