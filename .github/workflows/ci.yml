name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (macos)
    runs-on: macos-latest
    # fmt/clippy/test + the self-hosted Tauri release build; 60 min was tight on a cold cache.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-25
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"

      # The pnpm version is pinned by package.json `packageManager` (pnpm@12.14.0).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check committed release version sources agree
        run: node scripts/check-release-version.mjs

      # The desktop crate embeds the built frontend, so `dist/` has to exist
      # before cargo compiles or tests the workspace.
      - name: Build renderer
        run: pnpm build:renderer

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Build the self-hosted app for this commit
        run: ./scripts/build-headway.sh app

      - name: Verify self-hosted artifacts
        shell: bash
        run: |
          set -euo pipefail
          HEADWAY_HOME="$(mktemp -d)" .headway-out/Headway.app/Contents/MacOS/headway --json version > .headway-out/build-info.json
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync(".headway-out/build-info.json", "utf8"));
            assert.equal(report.ok, true);
            assert.equal(report.data.commit, process.env.GITHUB_SHA);
            assert.equal(report.data.dirty, false);
            assert.equal(report.data.repository, process.env.GITHUB_REPOSITORY);
          '
          codesign --verify --deep --strict .headway-out/Headway.app

  frontend:
    name: frontend (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version is pinned by package.json `packageManager` (pnpm@12.14.0).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # TypeScript AST against the Rust `generate_handler![]` list and command signatures:
      # catches a renamed/removed invoke, handler or argument on either side of the IPC bridge.
      - name: IPC contract (frontend bindings vs Rust commands)
        run: pnpm run check:ipc

      - name: Test Apple signing environment normalization
        run: bash scripts/apple-signing-env.test.sh

      - name: Test token environment stripping
        run: bash scripts/token-env.test.sh

      - name: Test release guard and Homebrew planner
        run: node --test scripts/*.test.mjs

  packaging:
    name: packaging (macos signing policy)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-25
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"

      # The pnpm version is pinned by package.json `packageManager` (pnpm@12.14.0).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Regression for the native packaging recipe: generated signing policy (ad-hoc today,
      # hardened runtime for a Developer ID identity), strict signature verification and the
      # system-only Mach-O dependency allowlist.
      - name: Native packaging and signing-policy regression
        run: ./scripts/test-macos-packaging.sh "$RUNNER_TEMP/packaging-evidence"

      - name: Upload packaging evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaging-evidence
          path: ${{ runner.temp }}/packaging-evidence
          if-no-files-found: ignore
          retention-days: 7
